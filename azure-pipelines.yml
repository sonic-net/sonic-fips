# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

schedules:
- cron: "0 0 * * 0"
  displayName: Weekly midnight build
  branches:
    include:
    - main
  always: true

trigger: none
pr:
  branches:
    include:
      - main

stages:
- stage: build
  jobs:
  - template: .azure-pipelines/build-template.yml
    parameters:
      pool: sonicso1ES-amd64
  - template: .azure-pipelines/build-template.yml
    parameters:
      pool: sonicso1ES-arm64
      arch: arm64
  - template: .azure-pipelines/build-template.yml
    parameters:
      pool: sonicso1ES-armhf
      arch: armhf
      image: sonicdev-microsoft.azurecr.io/sonic-slave-trixie-armhf
- stage: test
  variables:
    CMAKE_BUILD_TYPE: Debug
  dependsOn: []
  jobs:
  - template: .azure-pipelines/test-template-armhf.yml
  - job: TestReleaseAutomation
    pool:
      vmImage: ubuntu-22.04
    steps:
    - checkout: self
      persistCredentials: false
    - bash: python3 -m unittest discover -s tests -v
      displayName: Test release automation (offline)
- stage: publish_github_release
  displayName: Publish GitHub release archives
  dependsOn:
  - build
  - test
  # Defense in depth: the script repeats these checks before any GitHub write.
  condition: and(eq(dependencies.build.result, 'Succeeded'), eq(dependencies.test.result, 'Succeeded'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.Repository.Name'], 'sonic-net/sonic-fips'), ne(variables['System.PullRequest.IsFork'], 'True'))
  jobs:
  - job: release
    pool:
      vmImage: ubuntu-22.04
    steps:
    - checkout: self
      persistCredentials: false
    - task: DownloadPipelineArtifact@2
      displayName: Download current amd64 packages
      inputs:
        buildType: current
        artifact: fips-symcrypt-amd64
        path: $(Pipeline.Workspace)/release-input/fips-symcrypt-amd64
    - task: DownloadPipelineArtifact@2
      displayName: Download current arm64 packages
      inputs:
        buildType: current
        artifact: fips-symcrypt-arm64
        path: $(Pipeline.Workspace)/release-input/fips-symcrypt-arm64
    - task: DownloadPipelineArtifact@2
      displayName: Download current armhf packages
      inputs:
        buildType: current
        artifact: fips-symcrypt-armhf
        path: $(Pipeline.Workspace)/release-input/fips-symcrypt-armhf
    - bash: |
        set -euo pipefail
        python3 scripts/publish_github_release.py \
          --artifacts "$(Pipeline.Workspace)/release-input" \
          --build-id "$BUILD_BUILDID" --commit "$BUILD_SOURCEVERSION" --require-ci
      displayName: Verify packages and publish release
      env:
        GH_TOKEN: $(GITHUB_TOKEN)
